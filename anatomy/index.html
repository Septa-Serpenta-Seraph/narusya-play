  .view-container { width: 100%; height: 100vh; display: none; }

  .sector { fill-opacity: 0.06; stroke-opacity: 0.15; stroke-width: 1px; }
  .node circle { stroke: #fff; stroke-width: 1.2px; cursor: pointer; }
  .node text { font-size: 9px; fill: #c8c8d0; pointer-events: none; text-anchor: middle; }
  .node.center circle { r: 14; filter: drop-shadow(0 0 12px #d4af37); }
  .node.center text { font-size: 11px; font-weight: 700; fill: #d4af37; }
  .link { stroke-opacity: 0.25; stroke-width: 1px; }

  .node.highlighted circle { stroke: #fff; stroke-width: 2.5px; filter: drop-shadow(0 0 6px currentColor); }

  .link.dimmed { opacity: 0.03; }

// === ANATOMY VIEW ===
const width = window.innerWidth;
const height = window.innerHeight;

const svg = d3.select('#graph').append('svg').attr('width', width).attr('height', height);
const g = svg.append('g');
const zoom = d3.zoom().scaleExtent([0.2, 4]).on('zoom', (e) => g.attr('transform', e.transform));
svg.call(zoom);

const simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id).distance(90))
  .force('charge', d3.forceManyBody().strength(-250))
  .force('center', d3.forceCenter(width/2, height/2))
  .force('collision', d3.forceCollide().radius(22))
  .force('x', d3.forceX(d => {
    const layer = layers.find(l => l.id === d.layer);
    const idx = layers.indexOf(layer);
    return (idx / (layers.length - 1)) * width * 0.7 + width * 0.15;
  }).strength(0.15))
  .force('y', d3.forceY(d => {
    const layer = layers.find(l => l.id === d.layer);
    const idx = layers.indexOf(layer);
    return (idx % 3) * height * 0.3 + height * 0.2;
  }).strength(0.1));

const sectorGroup = g.append('g').attr('class', 'sectors');
let showSectors = true;

function drawSectors() {
  sectorGroup.selectAll('*').remove();
  if (!showSectors) return;
  layers.forEach(layer => {
    const layerNodes = nodes.filter(n => n.layer === layer.id && activeLayers.has(layer.id));
    if (layerNodes.length < 3) return;
    const hull = d3.polygonHull(layerNodes.map(n => [n.x, n.y]));
    if (!hull) return;
    sectorGroup.append('path')
      .datum(hull)
      .attr('class', 'sector')
      .attr('d', d => 'M' + d.join('L') + 'Z')
      .attr('fill', layer.color)
      .attr('stroke', layer.color);
  });
}

const link = g.append('g').selectAll('line').data(links).join('line')
  .attr('class', 'link')
  .attr('stroke', d => {
    const src = nodes.find(n => n.id === (typeof d.source === 'object' ? d.source.id : d.source));
    return src ? colorScale(src.layer) : '#555';
  });

const node = g.append('g').selectAll('g').data(nodes).join('g')
  .attr('class', d => 'node' + (d.id === 'narusya' ? ' center' : ''))
  .call(d3.drag()
    .on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on('end', (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

node.append('circle').attr('r', d => d.id === 'narusya' ? 14 : 7).attr('fill', d => colorScale(d.layer));
node.append('text').attr('dy', d => d.id === 'narusya' ? 22 : 18).text(d => d.name);

const tooltip = d3.select('#tooltip');
node.on('mouseover', (e, d) => {
  tooltip.style('opacity', 1)
    .style('left', Math.min(e.pageX + 15, window.innerWidth - 300) + 'px')
    .style('top', Math.min(e.pageY - 10, window.innerHeight - 120) + 'px')
    .html(`<div class="title">${d.name}</div><div class="desc">${d.desc}</div><div class="layer">${layerMap[d.layer].name}</div>`);
}).on('mouseout', () => tooltip.style('opacity', 0));

let selectedNode = null;
node.on('click', (e, d) => {
  if (selectedNode === d.id) {
    selectedNode = null;
    node.classed('dimmed', false).classed('highlighted', false);
    link.classed('dimmed', false).classed('highlighted', false);
    return;
  }
  selectedNode = d.id;
  const connected = new Set([d.id]);
  links.forEach(l => {
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    if (s === d.id) connected.add(t);
    if (t === d.id) connected.add(s);
  });
  node.classed('dimmed', n => !connected.has(n.id)).classed('highlighted', n => connected.has(n.id) && n.id !== d.id);
  link.classed('dimmed', l => {
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    return s !== d.id && t !== d.id;
  }).classed('highlighted', l => {
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    return s === d.id || t === d.id;
  });
});

document.getElementById('reset').addEventListener('click', () => {
  selectedNode = null;
  node.classed('dimmed', false).classed('highlighted', false);
  link.classed('dimmed', false).classed('highlighted', false);
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
});

let showLabels = true;
document.getElementById('toggle-labels').addEventListener('click', (e) => {
  showLabels = !showLabels;
  node.select('text').style('display', showLabels ? null : 'none');
  e.target.classList.toggle('active', showLabels);
});

let activeLayers = new Set(layers.map(l => l.id));
function toggleLayer(layerId) {
  if (activeLayers.has(layerId)) activeLayers.delete(layerId);
  else activeLayers.add(layerId);
  updateVisibility();
}
function updateVisibility() {
  node.style('display', d => activeLayers.has(d.layer) ? null : 'none');
  link.style('display', d => {
    const s = typeof d.source === 'object' ? d.source.id : d.source;
    const t = typeof d.target === 'object' ? d.target.id : d.target;
    const srcNode = nodes.find(n => n.id === s);
    const tgtNode = nodes.find(n => n.id === t);
    return (srcNode && activeLayers.has(srcNode.layer) && tgtNode && activeLayers.has(tgtNode.layer)) ? null : 'none';
  });
  document.querySelectorAll('.legend-item, .layer-row').forEach(el => {
    const lid = el.dataset.layer;
    if (lid) el.classList.toggle('active', activeLayers.has(lid));
  });
  drawSectors();
}

document.getElementById('toggle-sectors').addEventListener('click', (e) => {
  showSectors = !showSectors;
  e.target.classList.toggle('active', showSectors);
  drawSectors();
});

simulation.on('tick', () => {
  link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  node.attr('transform', d => `translate(${d.x},${d.y})`);
  drawSectors();
  const loading = document.getElementById('loading');
  if (loading) loading.style.display = 'none';
});

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  svg.attr('width', w).attr('height', h);
  simulation.force('center', d3.forceCenter(w/2, h/2));
  simulation.alpha(0.3).restart();
});

// === SEARCH ===
document.getElementById('search-input').addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase();
  if (!query) {
    node.classed('dimmed', false);
    return;
  }
  node.classed('dimmed', d => !d.name.toLowerCase().includes(query) && !d.id.toLowerCase().includes(query));
});

// === MEMORY VIEW ===
function initMemoryView() {
  memoryInitialized = true;
  const memWidth = window.innerWidth;
  const memHeight = window.innerHeight;
  const memSvg = d3.select('#memory-graph').append('svg').attr('width', memWidth).attr('height', memHeight);
  const memG = memSvg.append('g');
  const memZoom = d3.zoom().scaleExtent([0.5, 5]).on('zoom', (e) => memG.attr('transform', e.transform));
  memSvg.call(memZoom);

  const roleColors = { user: '#60a5fa', assistant: '#4ade80', unknown: '#555', system: '#f472b6' };
  const padding = 60;
  const xScale = d3.scaleLinear().domain([0, 1]).range([padding, memWidth - padding]);
  const yScale = d3.scaleLinear().domain([0, 1]).range([padding, memHeight - padding]);

  const memNodes = memG.selectAll('circle')
    .data(qdrantData)
    .join('circle')
    .attr('class', 'mem-dot')
    .attr('cx', d => xScale(d.x))
    .attr('cy', d => yScale(d.y))
    .attr('r', 3)
    .attr('fill', d => roleColors[d.role] || '#555')
    .attr('opacity', 0.6)
    .on('mouseover', (e, d) => {
      tooltip.style('opacity', 1)
        .style('left', Math.min(e.pageX + 15, window.innerWidth - 300) + 'px')
        .style('top', Math.min(e.pageY - 10, window.innerHeight - 120) + 'px')
        .html(`<div class="title">${d.role}</div><div class="desc">${d.text ? d.text.substring(0, 200) : '(no text)'}</div><div class="layer">${d.date}</div>`);
    })
    .on('mouseout', () => tooltip.style('opacity', 0));

  const memLegend = memSvg.append('g').attr('transform', `translate(${padding}, ${padding})`);
  Object.entries(roleColors).forEach(([role, color], i) => {
    const gg = memLegend.append('g').attr('transform', `translate(0, ${i * 18})`);
    gg.append('circle').attr('r', 5).attr('fill', color).attr('cx', 5).attr('cy', 5);
    gg.append('text').attr('x', 15).attr('y', 9).attr('fill', '#aaa').attr('font-size', '11px').text(role);
  });

  memSvg.append('text')
    .attr('x', memWidth / 2).attr('y', 30)
    .attr('text-anchor', 'middle')
    .attr('fill', '#d4af37')
    .attr('font-size', '14px')
    .attr('font-weight', '600')
    .text('Memory Map — 200 sampled points from Qdrant (PCA-projected, 384-dim → 2D)');
}

      .style('left', Math.min(e.pageX + 15, window.innerWidth - 300) + 'px')
      .style('top', Math.min(e.pageY - 10, window.innerHeight - 120) + 'px')
      .html(`<div class="title">${d.name}</div><div class="desc">${d.desc}</div><div class="layer">${d.role}</div>`);
  }).on('mouseout', () => tooltip.style('opacity', 0));

  rsim.on('tick', () => {
    rl.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    rn.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  // Legend
  const rlegend = rsvg.append('g').attr('transform', 'translate(20, 20)');
  Object.entries(roleColors).forEach(([role, color], i) => {
    const gg = rlegend.append('g').attr('transform', `translate(0, ${i * 18})`);
    gg.append('circle').attr('r', 5).attr('fill', color).attr('cx', 5).attr('cy', 5);
    gg.append('text').attr('x', 15).attr('y', 9).attr('fill', '#aaa').attr('font-size', '11px').text(role);
  });

  rsvg.append('text').attr('x', rw/2).attr('y', 30).attr('text-anchor', 'middle').attr('fill', '#d4af37').attr('font-size', '14px').attr('font-weight', '600').text('Relationship Web — connections between people in Narusya\'s life');
}

// === EXPORT ===
document.getElementById('export-png').addEventListener('click', () => {
  const activeSvg = document.querySelector('.view-container.active svg');
  if (!activeSvg) return;
  const serializer = new XMLSerializer();
  const svgStr = serializer.serializeToString(activeSvg);
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  const svgBlob = new Blob([svgStr], {type: 'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);
  img.onload = () => {
    canvas.width = img.width * 2;
    canvas.height = img.height * 2;
    ctx.scale(2, 2);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    const pngUrl = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = pngUrl;
    a.download = 'narusya-anatomy.png';
    a.click();
  };
  img.src = url;
});

document.getElementById('export-svg').addEventListener('click', () => {
  const activeSvg = document.querySelector('.view-container.active svg');
  if (!activeSvg) return;
  const serializer = new XMLSerializer();
  const svgStr = serializer.serializeToString(activeSvg);
  const blob = new Blob([svgStr], {type: 'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'narusya-anatomy.svg';
  a.click();
  URL.revokeObjectURL(url);
});

// === MINIMAP ===
function updateMinimap() {
  const minimapSvg = d3.select('#minimap svg');
  minimapSvg.selectAll('*').remove();
  const mw = 160, mh = 120;
  const xExtent = d3.extent(nodes, d => d.x);
  const yExtent = d3.extent(nodes, d => d.y);
  const xScale = d3.scaleLinear().domain(xExtent).range([5, mw-5]);
  const yScale = d3.scaleLinear().domain(yExtent).range([5, mh-5]);
  minimapSvg.selectAll('circle').data(nodes).join('circle')
    .attr('cx', d => xScale(d.x)).attr('cy', d => yScale(d.y))
    .attr('r', 2).attr('fill', d => colorScale(d.layer)).attr('opacity', 0.7);
}
setTimeout(updateMinimap, 3000);
</script>
