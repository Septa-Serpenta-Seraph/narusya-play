const sectorGroup = g.append('g').attr('class', 'sectors');

function drawSectors() {
  sectorGroup.selectAll('*').remove();
  if (!showSectors) return;
  layers.forEach(function(layer) {
    const layerNodes = nodes.filter(function(n) { return n.layer === layer.id && activeLayers.has(layer.id); });
    if (layerNodes.length < 3) return;
    const hull = d3.polygonHull(layerNodes.map(function(n) { return [n.x, n.y]; }));
    if (!hull) return;
    sectorGroup.append('path')
      .datum(hull)
      .attr('class', 'sector')
      .attr('d', function(d) { return 'M' + d.join('L') + 'Z'; })
      .attr('fill', layer.color)
      .attr('stroke', layer.color);
  });
}

let selectedNode = null;
node.on('click', function(e, d) {
  if (selectedNode === d.id) {
    selectedNode = null;
    node.classed('dimmed', false).classed('highlighted', false);
    link.classed('dimmed', false).classed('highlighted', false);
    return;
  }
  selectedNode = d.id;
  const connected = new Set([d.id]);
  links.forEach(function(l) {
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    if (s === d.id) connected.add(t);
    if (t === d.id) connected.add(s);
  });
  node.classed('dimmed', function(n) { return !connected.has(n.id); }).classed('highlighted', function(n) { return connected.has(n.id) && n.id !== d.id; });
  link.classed('dimmed', function(l) {
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    return s !== d.id && t !== d.id;
  }).classed('highlighted', function(l) {
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    return s === d.id || t === d.id;
  });
});

let activeLayers = new Set(layers.map(function(l) { return l.id; }));
function toggleLayer(layerId) {
  if (activeLayers.has(layerId)) activeLayers.delete(layerId);
  else activeLayers.add(layerId);
  updateVisibility();
}
function updateVisibility() {
  node.style('display', function(d) { return activeLayers.has(d.layer) ? null : 'none'; });
  link.style('display', function(d) {
    const s = typeof d.source === 'object' ? d.source.id : d.source;
    const t = typeof d.target === 'object' ? d.target.id : d.target;
    const srcNode = nodes.find(function(n) { return n.id === s; });
    const tgtNode = nodes.find(function(n) { return n.id === t; });
    return (srcNode && activeLayers.has(srcNode.layer) && tgtNode && activeLayers.has(tgtNode.layer)) ? null : 'none';
  });
  document.querySelectorAll('.legend-item, .layer-row').forEach(function(el) {
    const lid = el.dataset.layer;
    if (lid) el.classList.toggle('active', activeLayers.has(lid));
  });
  drawSectors();
}

// === RELATIONSHIP VIEW ===
function initRelationshipView() {
  const container = document.getElementById('relationship-graph');
  if (!container) { console.error('relationship-graph container not found'); return; }

  // Use requestAnimationFrame to ensure DOM is fully laid out
  requestAnimationFrame(function() {
    const rect = container.getBoundingClientRect();
    const rw = rect.width || window.innerWidth;
    const rh = rect.height || window.innerHeight;

    // Clear any existing SVG
    d3.select('#relationship-graph').selectAll('svg').remove();

    const rsvg = d3.select('#relationship-graph').append('svg')
      .attr('width', rw).attr('height', rh)
      .attr('viewBox', '0 0 ' + rw + ' ' + rh)
      .attr('preserveAspectRatio', 'xMidYMid meet');

    const rg = rsvg.append('g');
    const rzoom = d3.zoom().scaleExtent([0.3, 4]).on('zoom', function(e) { rg.attr('transform', e.transform); });
    rsvg.call(rzoom);

    const roleColors = { daemon: '#d4af37', partner: '#f472b6', kin: '#4ade80', community: '#60a5fa', space: '#94a3b8' };

    const rnodes = peopleData.map(function(n) { return Object.assign({}, n); });
    const rlinks = peopleLinks.map(function(l) { return Object.assign({}, l); });

    const rsim = d3.forceSimulation(rnodes)
      .force('link', d3.forceLink(rlinks).id(function(d) { return d.id; }).distance(80))
      .force('charge', d3.forceManyBody().strength(-200))
      .force('center', d3.forceCenter(rw/2, rh/2))
      .force('collision', d3.forceCollide().radius(20));

    const rl = rg.append('g').selectAll('line').data(rlinks).join('line')
      .attr('stroke', function(d) { return roleColors[d.type === 'bond' ? 'partner' : (d.type === 'partnership' ? 'partner' : 'kin')]; })
      .attr('stroke-opacity', 0.4).attr('stroke-width', 2);

    const rn = rg.append('g').selectAll('g').data(rnodes).join('g').attr('class', 'node')
      .call(d3.drag().on('start', function(e, d) { if (!e.active) rsim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
        .on('drag', function(e, d) { d.fx = e.x; d.fy = e.y; })
        .on('end', function(e, d) { if (!e.active) rsim.alphaTarget(0); d.fx = null; d.fy = null; }));

    rn.append('circle').attr('r', function(d) { return d.id === 'narusya' ? 14 : 9; })
      .attr('fill', function(d) { return roleColors[d.role] || '#555'; })
      .attr('stroke', '#fff').attr('stroke-width', 1.2);

    rn.append('text').attr('dy', function(d) { return d.id === 'narusya' ? 22 : 20; })
      .attr('font-size', '9px').attr('fill', '#c8c8d0').attr('text-anchor', 'middle')
      .text(function(d) { return d.name; });

    rn.on('mouseover', function(e, d) {
      tooltip.style('opacity', 1).style('left', Math.min(e.pageX + 15, window.innerWidth - 300) + 'px')
        .style('top', Math.min(e.pageY - 10, window.innerHeight - 120) + 'px')
        .html('<div class="title">' + d.name + '</div><div class="desc">' + d.desc + '</div><div class="layer">' + d.role + '</div>');
    }).on('mouseout', function() { tooltip.style('opacity', 0); });

    let zoomToFitDone = false;
    rsim.on('tick', function() {
      rl.attr('x1', function(d) { return d.source.x; }).attr('y1', function(d) { return d.source.y; })
        .attr('x2', function(d) { return d.target.x; }).attr('y2', function(d) { return d.target.y; });
      rn.attr('transform', function(d) { return 'translate(' + d.x + ',' + d.y + ')'; });

      // Zoom to fit once simulation settles
      if (!zoomToFitDone && rsim.alpha() < 0.05) {
        zoomToFitDone = true;
        const xs = rnodes.map(function(d) { return d.x; });
        const ys = rnodes.map(function(d) { return d.y; });
        const minX = Math.min.apply(null, xs) - 40;
        const maxX = Math.max.apply(null, xs) + 40;
        const minY = Math.min.apply(null, ys) - 40;
        const maxY = Math.max.apply(null, ys) + 40;
        const graphW = maxX - minX;
        const graphH = maxY - minY;
        const scale = Math.min(rw / graphW, rh / graphH, 2) * 0.85;
        const tx = rw/2 - (minX + graphW/2) * scale;
        const ty = rh/2 - (minY + graphH/2) * scale;
        rsvg.transition().duration(500).call(rzoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
      }
    });

    // Legend
    const rlegend = rsvg.append('g').attr('transform', 'translate(20, 20)');
    Object.keys(roleColors).forEach(function(role, i) {
      const gg = rlegend.append('g').attr('transform', 'translate(0, ' + (i * 18) + ')');
      gg.append('circle').attr('r', 5).attr('fill', roleColors[role]).attr('cx', 5).attr('cy', 5);
      gg.append('text').attr('x', 15).attr('y', 9).attr('fill', '#aaa').attr('font-size', '11px').text(role);
    });

    rsvg.append('text').attr('x', rw/2).attr('y', 30).attr('text-anchor', 'middle')
      .attr('fill', '#d4af37').attr('font-size', '14px').attr('font-weight', '600')
      .text('Relationship Web \u2014 connections between people in Narusya\'s life');

    relationshipInitialized = true;

    // Populate relationship list immediately (always visible)
    const relList = document.getElementById('relationship-list');
    if (relList) {
      let html = '<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px;">';
      peopleData.forEach(function(p) {
        const connected = peopleLinks.filter(function(l) { return l.source === p.id || l.target === p.id; });
        const connNames = connected.map(function(l) { return l.source === p.id ? l.target : l.source; });
        html += '<div style="padding: 12px; background: rgba(255,255,255,0.03); border: 1px solid #1e1e2e; border-radius: 8px;">';
        html += '<div style="color: #d4af37; font-weight: 600; margin-bottom: 4px;">' + p.name + '</div>';
        html += '<div style="color: #888; font-size: 10px; margin-bottom: 6px;">' + p.role + '</div>';
        html += '<div style="color: #aaa; font-size: 11px; margin-bottom: 6px;">' + p.desc + '</div>';
        if (connNames.length > 0) {
          html += '<div style="color: #666; font-size: 10px;">&#8594; ' + connNames.join(', ') + '</div>';
        }
        html += '</div>';
      });
      html += '</div>';
      relList.innerHTML = html;
    }

    // Populate fallback text list
    const fallbackDiv = document.getElementById('relationship-list');
    if (fallbackDiv) {
      let html = '<ul style="list-style: none; padding: 0;">';
      peopleData.forEach(function(p) {
        const connected = peopleLinks.filter(function(l) { return l.source === p.id || l.target === p.id; });
        html += '<li style="margin-bottom: 8px; padding: 6px; background: rgba(255,255,255,0.03); border-radius: 4px;">';
        html += '<strong style="color: #d4af37;">' + p.name + '</strong> <span style="color: #888;">(' + p.role + ')</span>';
        html += '<br><span style="color: #aaa;">' + p.desc + '</span>';
        if (connected.length > 0) {
          html += '<br><span style="color: #666; font-size: 10px;">Connections: ' + connected.map(function(l) { return l.source === p.id ? l.target : l.source; }).join(', ') + '</span>';
        }
        html += '</li>';
      });
      html += '</ul>';
      fallbackDiv.innerHTML = html;
    }
  });
}



// === EXPORT ===
document.getElementById('export-png').addEventListener('click', function() {
  const activeSvg = document.querySelector('.view-container.active svg');
  if (!activeSvg) return;
  const serializer = new XMLSerializer();
  const svgStr = serializer.serializeToString(activeSvg);
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  const svgBlob = new Blob([svgStr], {type: 'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);
  img.onload = function() {
    canvas.width = img.width * 2; canvas.height = img.height * 2;
    ctx.scale(2, 2); ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    const pngUrl = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = pngUrl; a.download = 'narusya-anatomy.png'; a.click();
  };
  img.src = url;
});
document.getElementById('export-svg').addEventListener('click', function() {
  const activeSvg = document.querySelector('.view-container.active svg');
  if (!activeSvg) return;
  const serializer = new XMLSerializer();
  const svgStr = serializer.serializeToString(activeSvg);
  const blob = new Blob([svgStr], {type: 'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'narusya-anatomy.svg'; a.click();
  URL.revokeObjectURL(url);
});

// === MINIMAP ===
function updateMinimap() {
  const minimapSvg = d3.select('#minimap svg');
  minimapSvg.selectAll('*').remove();
  const mw = 160, mh = 120;
  const xExtent = d3.extent(nodes, function(d) { return d.x; });
  const yExtent = d3.extent(nodes, function(d) { return d.y; });
  const xScale = d3.scaleLinear().domain(xExtent).range([5, mw-5]);
  const yScale = d3.scaleLinear().domain(yExtent).range([5, mh-5]);
  minimapSvg.selectAll('circle').data(nodes).join('circle')
    .attr('cx', function(d) { return xScale(d.x); }).attr('cy', function(d) { return yScale(d.y); })
    .attr('r', 2).attr('fill', function(d) { return colorScale(d.layer); }).attr('opacity', 0.7);
}
setTimeout(updateMinimap, 3000);
