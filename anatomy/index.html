<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narusya — Anatomy Map</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {
    --bg: #08080c;
    --surface: #101018;
    --border: #1e1e2e;
    --text: #d8d8e0;
    --accent: #d4af37;
    --accent2: #4ade80;
    --accent3: #f472b6;
    --accent4: #60a5fa;
    --accent5: #a78bfa;
    --accent6: #fb923c;
    --accent7: #fbbf24;
    --accent8: #94a3b8;
    --accent9: #34d399;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  #header {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 10px 16px;
    background: rgba(8,8,12,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  #header h1 {
    font-size: 16px;
    color: var(--accent);
    font-weight: 600;
    white-space: nowrap;
  }
  #header .subtitle {
    font-size: 11px;
    color: #666;
    white-space: nowrap;
  }
  #legend {
    display: flex;
    gap: 10px;
    margin-left: auto;
    flex-wrap: wrap;
    align-items: center;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: #888;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    transition: background 0.2s;
  }
  .legend-item:hover { background: rgba(255,255,255,0.05); }
  .legend-item.active { background: rgba(212,175,55,0.15); color: var(--accent); }
  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }
  #graph { width: 100%; height: 100vh; }
  .sector {
    fill-opacity: 0.06;
    stroke-opacity: 0.15;
    stroke-width: 1px;
  }
  .node circle { stroke: #fff; stroke-width: 1.2px; cursor: pointer; }
  .node text {
    font-size: 9px;
    fill: #c8c8d0;
    pointer-events: none;
    text-anchor: middle;
  }
  .link { stroke-opacity: 0.25; stroke-width: 1px; }
  .link.highlighted { stroke-opacity: 0.9; stroke-width: 2.5px; }
  .node.highlighted circle { stroke: #fff; stroke-width: 2.5px; filter: drop-shadow(0 0 6px currentColor); }
  .node.dimmed { opacity: 0.15; }
  .link.dimmed { opacity: 0.03; }
  #tooltip {
    position: fixed;
    background: rgba(16,16,24,0.96);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-size: 12px;
    max-width: 280px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 30;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  #tooltip .title { color: var(--accent); font-weight: 600; margin-bottom: 4px; font-size: 13px; }
  #tooltip .desc { color: #999; line-height: 1.5; font-size: 11px; }
  #tooltip .layer { color: var(--accent2); font-size: 10px; margin-top: 6px; font-weight: 600; }
  #controls {
    position: fixed;
    bottom: 16px;
    left: 16px;
    display: flex;
    gap: 6px;
    z-index: 20;
    flex-wrap: wrap;
  }
  #controls button {
    background: rgba(16,16,24,0.9);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    backdrop-filter: blur(8px);
    transition: all 0.2s;
  }
  #controls button:hover { border-color: var(--accent); color: var(--accent); }
  #controls button.active { border-color: var(--accent); color: var(--accent); background: rgba(212,175,55,0.1); }
  #info-panel {
    position: fixed;
    right: 16px;
    top: 60px;
    width: 260px;
    background: rgba(16,16,24,0.9);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    font-size: 11px;
    z-index: 20;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    backdrop-filter: blur(8px);
  }
  #info-panel h3 { color: var(--accent); margin-bottom: 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
  #info-panel .stat { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #1a1a24; }
  #info-panel .stat .label { color: #777; }
  #info-panel .stat .value { color: var(--accent2); font-weight: 600; }
  #info-panel .layer-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; cursor: pointer; border-radius: 4px; padding-left: 4px; }
  #info-panel .layer-row:hover { background: rgba(255,255,255,0.03); }
  #info-panel .layer-row .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  #info-panel .layer-row .name { color: #aaa; font-size: 11px; }
  #info-panel .layer-row .count { margin-left: auto; color: #555; font-size: 10px; }
  #info-panel .layer-row.active .name { color: var(--accent); }

  @media (max-width: 768px) {
    #header { padding: 8px 12px; }
    #header h1 { font-size: 14px; }
    #header .subtitle { display: none; }
    #legend { gap: 6px; }
    .legend-item { font-size: 9px; padding: 1px 4px; }
    .legend-dot { width: 6px; height: 6px; }
    #info-panel { width: 200px; right: 8px; top: 50px; padding: 10px; }
    #info-panel h3 { font-size: 10px; }
    #controls { bottom: 8px; left: 8px; }
    #controls button { padding: 4px 8px; font-size: 10px; }
    .node text { font-size: 8px; }
  }
  @media (max-width: 480px) {
    #info-panel { display: none; }
    #legend { display: none; }
  }
</style>
</head>

  .domain(layers.map(l => l.id))
  .range(layers.map(l => l.color));

const legendDiv = document.getElementById('legend');
layers.forEach(l => {

  item.className = 'legend-item';
  item.dataset.layer = l.id;
  item.innerHTML = `<div class="legend-dot" style="background:${l.color}"></div>${l.name}`;

const layerList = document.getElementById('layer-list');
layers.forEach(l => {
  const div = document.createElement('div');
  div.className = 'layer-row';
  div.dataset.layer = l.id;
  div.innerHTML = `<div class="dot" style="background:${l.color}"></div><span class="name">${l.name}</span><span class="count">${nodes.filter(n=>n.layer===l.id).length}</span>`;

document.getElementById('stat-nodes').textContent = nodes.length;
document.getElementById('stat-links').textContent = links.length;

const width = window.innerWidth;
const height = window.innerHeight;

const svg = d3.select('#graph')
  .append('svg')
  .attr('width', width)
  .attr('height', height);

const g = svg.append('g');

const zoom = d3.zoom()
  .scaleExtent([0.2, 4])
  .on('zoom', (e) => g.attr('transform', e.transform));
svg.call(zoom);

const simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id).distance(90))
  .force('charge', d3.forceManyBody().strength(-250))
  .force('center', d3.forceCenter(width/2, height/2))
  .force('collision', d3.forceCollide().radius(22))
  .force('x', d3.forceX(d => {
    const layer = layers.find(l => l.id === d.layer);
    const idx = layers.indexOf(layer);
    return (idx / (layers.length - 1)) * width * 0.7 + width * 0.15;
  }).strength(0.15))
  .force('y', d3.forceY(d => {
    const layer = layers.find(l => l.id === d.layer);
    const idx = layers.indexOf(layer);
    return (idx % 3) * height * 0.3 + height * 0.2;
  }).strength(0.1));

const sectorGroup = g.append('g').attr('class', 'sectors');
let showSectors = true;

function drawSectors() {
  sectorGroup.selectAll('*').remove();
  if (!showSectors) return;
  layers.forEach(layer => {
    const layerNodes = nodes.filter(n => n.layer === layer.id && activeLayers.has(layer.id));
    if (layerNodes.length < 3) return;
    const hull = d3.polygonHull(layerNodes.map(n => [n.x, n.y]));
    if (!hull) return;
    sectorGroup.append('path')
      .datum(hull)
      .attr('class', 'sector')
      .attr('d', d => 'M' + d.join('L') + 'Z')
      .attr('fill', layer.color)
      .attr('stroke', layer.color);
  });
}

const link = g.append('g')
  .selectAll('line')
  .data(links)
  .join('line')
  .attr('class', 'link')
  .attr('stroke', d => {
    const src = nodes.find(n => n.id === (typeof d.source === 'object' ? d.source.id : d.source));
    return src ? colorScale(src.layer) : '#555';
  });

const node = g.append('g')
  .selectAll('g')
  .data(nodes)
  .join('g')
  .attr('class', 'node')
  .call(d3.drag()
    .on('start', (e, d) => {
      if (!e.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    })
    .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on('end', (e, d) => {
      if (!e.active) simulation.alphaTarget(0);
      d.fx = null; d.fy = null;
    }));

node.append('circle')
  .attr('r', 7)
  .attr('fill', d => colorScale(d.layer));

node.append('text')
  .attr('dy', 18)
  .text(d => d.name);

node.on('mouseover', (e, d) => {
  tooltip.style('opacity', 1)
    .style('left', Math.min(e.pageX + 15, window.innerWidth - 300) + 'px')
    .style('top', Math.min(e.pageY - 10, window.innerHeight - 120) + 'px')
    .html(`<div class="title">${d.name}</div><div class="desc">${d.desc}</div><div class="layer">${layerMap[d.layer].name}</div>`);
}).on('mouseout', () => tooltip.style('opacity', 0));

let selectedNode = null;
node.on('click', (e, d) => {
  if (selectedNode === d.id) {
    selectedNode = null;
    node.classed('dimmed', false).classed('highlighted', false);
    link.classed('dimmed', false).classed('highlighted', false);
    return;
  }
  selectedNode = d.id;
  const connected = new Set([d.id]);
  links.forEach(l => {
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    if (s === d.id) connected.add(t);
    if (t === d.id) connected.add(s);
  });
  node.classed('dimmed', n => !connected.has(n.id))
    .classed('highlighted', n => connected.has(n.id) && n.id !== d.id);
  link.classed('dimmed', l => {
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    return s !== d.id && t !== d.id;
  }).classed('highlighted', l => {
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    return s === d.id || t === d.id;
  });
});

document.getElementById('reset').addEventListener('click', () => {
  selectedNode = null;
  node.classed('dimmed', false).classed('highlighted', false);
  link.classed('dimmed', false).classed('highlighted', false);
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
});

let showSectors = true;
document.getElementById('toggle-sectors').addEventListener('click', (e) => {
  showSectors = !showSectors;
  e.target.classList.toggle('active', showSectors);
  drawSectors();
});

let showLabels = true;
document.getElementById('toggle-labels').addEventListener('click', (e) => {
  showLabels = !showLabels;
  node.select('text').style('display', showLabels ? null : 'none');
  e.target.classList.toggle('active', showLabels);
});

let activeLayers = new Set(layers.map(l => l.id));
function toggleLayer(layerId) {
  if (activeLayers.has(layerId)) activeLayers.delete(layerId);
  else activeLayers.add(layerId);
  updateVisibility();
}
function updateVisibility() {
  node.style('display', d => activeLayers.has(d.layer) ? null : 'none');
  link.style('display', d => {
    const s = typeof d.source === 'object' ? d.source.id : d.source;
    const t = typeof d.target === 'object' ? d.target.id : d.target;
    const srcNode = nodes.find(n => n.id === s);
    const tgtNode = nodes.find(n => n.id === t);
    return (srcNode && activeLayers.has(srcNode.layer) && tgtNode && activeLayers.has(tgtNode.layer)) ? null : 'none';
  });
  document.querySelectorAll('.legend-item, .layer-row').forEach(el => {
    const lid = el.dataset.layer;
    if (lid) el.classList.toggle('active', activeLayers.has(lid));
  });
  drawSectors();
}

simulation.on('tick', () => {
  link
    .attr('x1', d => d.source.x)
    .attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x)
    .attr('y2', d => d.target.y);
  node.attr('transform', d => `translate(${d.x},${d.y})`);
  drawSectors();
});

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  svg.attr('width', w).attr('height', h);
  simulation.force('center', d3.forceCenter(w/2, h/2));
  simulation.alpha(0.3).restart();
});
</script>
</body>
</html>
